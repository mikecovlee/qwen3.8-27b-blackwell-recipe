# New API gateway: multi-user keys, token-based billing and failover in front of SGLang.
# Data lives in ./data (SQLite). SESSION_SECRET is required and must be set in .env.
services:
  new-api:
    image: ${NEWAPI_IMAGE:-calciumion/new-api:v1.0.0-rc.36}
    container_name: llm-gateway
    ports:
      - "${GATEWAY_PORT:-8088}:3000"
    volumes:
      - ./data:/data
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set (see .env.example)}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
