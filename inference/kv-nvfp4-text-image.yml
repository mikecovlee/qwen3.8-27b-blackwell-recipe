# SGLang inference server — NVFP4 KV cache + vision (4 streams on 32 GB). EXPERIMENTAL.
#
# EXPERIMENTAL / NOT THE DEFAULT.  This profile exists only for 4 concurrent streams on
# 32 GB (or a 24 GB card).  On SM120 it carries two known defects with no fix:
#   1. Concurrent-long-prefill crash (upstream sizing bug): four concurrent requests whose
#      matched-prefix sum exceeds ~one context (empirically each prompt > ~140K tokens,
#      combined > ~2x the 262144 context) return HTTP 500 and restart the container.
#      No CLI flag avoids it (nvfp4 KV + flashinfer prefill is forced through the
#      NVFP4->FP8 dequant workspace on SM120), and disabling the prefill CUDA graph makes
#      it worse (crashes at 4x120K).  Keep the concurrent matched-prefix sum under ~262K
#      tokens (empirically each of 4 concurrent prompts <= ~120K); for 4-way
#      very-long-context use the FP8 profiles.
#   2. Occasional garbled reasoning under multi-session churn (observed in production).
# See README "NVFP4 caveats".
#
# Serves Qwen3.8-27B with a 262144-token context.  Default / lower-risk profile is
# kv-fp8-text-image.yml; high-concurrency text-only is kv-fp8-text-only.yml.  Full
# parameter rationale: see the "Tuning" section of the README.
#
# IMAGE (since 2026-11-09): llm-infer:nvfp4-f832b5c3 = llm-infer:hicache-f832b5c3
# (v0.5.23 base, digest f832b5c3, tree 297e54f; sched-latch retired — upstream
# #44401) plus the HiCache patches and ONE more patch set baked in, from
# inference/patches/nvfp4-host-transport/:
#   nvfp4-host-transport — port of upstream PR #46452 (open on main): NVFP4
#   host transfers now carry the FP4 payload AND its per-block scales.
#   Required on v0.5.23: its MHA host pool rejects the TOKEN scale layout at
#   startup; on v0.5.21 the same path SILENTLY DROPPED the scales on
#   write-back/load-back (upstream #43239/#36121 silent-corruption bug).
#   Rebuild: docker build -f nvfp4-host-transport/img-f832b5c3/Dockerfile \
#     -t llm-infer:nvfp4-f832b5c3 oss/inference/patches
# 2026-11-09 acceptance (isolated twin): T1 PASS, T3 PASS (safe 2/2),
# T4 REPLAY without SGLANG_HICACHE_MAMBA_SIZE_GB / PASS (D 0.3 s) with 8.5.
services:
  sglang:
    image: llm-infer:nvfp4-f832b5c3
    container_name: llm-infer
    ports:
      - "${SGLANG_PORT:-8080}:8080"
    volumes:
      - ${MODELS_DIR:-$HOME/models}:/models:ro
      - sglang-cache:/root/.cache
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - MAX_JOBS=4
      - PYTHONUNBUFFERED=1
      # Required by NVFP4 prefill activation on 32 GB.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Host mamba pool sizing (hicache C knob), same as the default profile:
      # REQUIRED on the v0.5.22+ write path (T4 REPLAY without it, PASS at
      # 8.5 GB — 2026-11-09 A/B on v0.5.23).
      - SGLANG_HICACHE_MAMBA_SIZE_GB=8.5
    shm_size: 8g
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - /models/${MODEL_DIR:-Qwen3.8-27B-NVFP4}
      - --kv-cache-dtype
      - nvfp4
      # Official v0.5.21 path: on SM120, NVFP4 KV dequantizes to fp8_e4m3 for prefill
      # attention and decodes with trtllm_mha (native NVFP4 prefill needs SM100).
      - --prefill-kv-cache-dequant-dtype
      - fp8_e4m3
      - --mem-fraction-static
      - "0.90"
      - --max-total-tokens
      - "262144"
      - --max-mamba-cache-size
      - "16"
      - --mamba-radix-cache-strategy
      - extra_buffer_lazy
      - --mamba-ssm-dtype
      - bfloat16
      # page_size becomes 64 with trtllm_mha; cap mamba states or the pool deadlocks.
      - --mamba-max-states-per-path
      - "2"
      - --max-running-requests
      - "4"
      - --cuda-graph-max-bs-decode
      - "4"
      - --schedule-policy
      - hrrn
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --served-model-name
      - ${MODEL_NAME:-qwen3.8-27b}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --enable-metrics
      # Required for the gateway's cache-hit pricing tier.
      - --enable-cache-report
      - --enable-hierarchical-cache
      - --hicache-ratio
      - "2"
      - --hicache-io-backend
      - kernel
      - --hicache-mem-layout
      - page_first
      # Vision: cap images at 2 Mpx (area) and preprocess on CPU.
      - --mm-process-config
      - '{"image": {"size": {"longest_edge": 2097152, "shortest_edge": 65536}}}'
      - --image-processor-backend
      - pil
      - --limit-mm-data-per-request
      - '{"image": 128, "video": 0}'

volumes:
  sglang-cache:
