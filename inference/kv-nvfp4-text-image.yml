# SGLang inference server — NVFP4 KV cache + vision (4 streams on 32 GB).
#
# KNOWN OCCASIONAL INSTABILITY: this profile emitted intermittent garbled reasoning in
# production (token-soup, once a 20000-token runaway) under multi-session churn —
# see README "NVFP4 caveats".  Use it only if you need 4 streams on 32 GB, or on a
# 24 GB card, where NVFP4 KV's smaller footprint is the only meaningful option.
#
# Serves Qwen3.8-27B with a 262144-token context.  Default / lower-risk profile is
# kv-fp8-text-image.yml; high-concurrency text-only is kv-fp8-text-only.yml.  Full
# parameter rationale: see the "Tuning" section of the README.
#
# IMAGE (v0.5.21): llm-infer:hicache-b1259f3e = v0.5.21 base (digest b1259f3e,
# tree e00930c) with the sched-latch + HiCache patches baked in (see
# inference/patches/).  This variant keeps 4 streams (mrr 4 / pool 16 / graph 4),
# the extra_buffer_lazy strategy and the NVFP4 KV + vision stack; see README
# "Tuning".  Rebuild command: README "The scheduler false-latch patch".
services:
  sglang:
    image: llm-infer:hicache-b1259f3e
    container_name: llm-infer
    ports:
      - "${SGLANG_PORT:-8080}:8080"
    volumes:
      - ${MODELS_DIR:-$HOME/models}:/models:ro
      - sglang-cache:/root/.cache
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - MAX_JOBS=4
      - PYTHONUNBUFFERED=1
      # Required by NVFP4 prefill activation on 32 GB.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    shm_size: 8g
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - /models/${MODEL_DIR:-Qwen3.8-27B-NVFP4}
      - --kv-cache-dtype
      - nvfp4
      # Official v0.5.21 path: on SM120, NVFP4 KV dequantizes to fp8_e4m3 for prefill
      # attention and decodes with trtllm_mha (native NVFP4 prefill needs SM100).
      - --prefill-kv-cache-dequant-dtype
      - fp8_e4m3
      - --mem-fraction-static
      - "0.90"
      - --max-total-tokens
      - "262144"
      - --max-mamba-cache-size
      - "16"
      - --mamba-radix-cache-strategy
      - extra_buffer_lazy
      - --mamba-ssm-dtype
      - bfloat16
      # page_size becomes 64 with trtllm_mha; cap mamba states or the pool deadlocks.
      - --mamba-max-states-per-path
      - "2"
      - --max-running-requests
      - "4"
      - --cuda-graph-max-bs-decode
      - "4"
      - --schedule-policy
      - hrrn
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --served-model-name
      - ${MODEL_NAME:-qwen3.8-27b}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --enable-metrics
      # Required for the gateway's cache-hit pricing tier.
      - --enable-cache-report
      - --enable-hierarchical-cache
      - --hicache-ratio
      - "2"
      - --hicache-io-backend
      - kernel
      - --hicache-mem-layout
      - page_first
      # Vision: cap images at 2 Mpx (area) and preprocess on CPU.
      - --mm-process-config
      - '{"image": {"size": {"longest_edge": 2097152, "shortest_edge": 65536}}}'
      - --image-processor-backend
      - pil
      - --limit-mm-data-per-request
      - '{"image": 128, "video": 0}'

volumes:
  sglang-cache:
