# SGLang inference server — FP8 KV cache, text only, HIGH CONCURRENCY (4 streams).
#
# The long-running text-only profile: FP8 KV (no FP4 accuracy caveat), vision
# tower disabled (`language_model_only`), 4 concurrent streams
# (mrr 4 / mamba pool 16 / graph bs 4), full 262144-token context.
#
# Pick this only when you never send images AND want maximum concurrency;
# otherwise prefer the default kv-fp8-text-image.yml.
# Full parameter rationale: see the "Tuning" section of the README.
#
# IMAGE (v0.5.21): llm-infer:hicache-b1259f3e = v0.5.21 base (digest b1259f3e,
# tree e00930c) with the sched-latch + HiCache patches baked in (see
# inference/patches/).  This variant keeps 4 streams (mrr 4 / pool 16 / graph 4)
# and the extra_buffer_lazy strategy; see README "Tuning".  Rebuild command:
# README "The scheduler false-latch patch".
services:
  sglang:
    image: llm-infer:hicache-b1259f3e
    container_name: llm-infer
    ports:
      - "${SGLANG_PORT:-8080}:8080"
    volumes:
      - ${MODELS_DIR:-$HOME/models}:/models:ro
      - sglang-cache:/root/.cache
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - MAX_JOBS=4
      - PYTHONUNBUFFERED=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    shm_size: 8g
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - /models/${MODEL_DIR:-Qwen3.8-27B-NVFP4}
      - --json-model-override-args
      - '{"language_model_only": true}'
      - --kv-cache-dtype
      - fp8_e4m3
      - --mem-fraction-static
      - "0.91"
      - --max-total-tokens
      - "262144"
      - --attention-backend
      - flashinfer
      - --max-mamba-cache-size
      - "16"
      - --mamba-radix-cache-strategy
      - extra_buffer_lazy
      - --mamba-ssm-dtype
      - bfloat16
      # Zero-cost safety cap on cached mamba states per radix path (matches the
      # extra_buffer_lazy ping-pong design; required when page_size becomes 64).
      - --mamba-max-states-per-path
      - "2"
      - --max-running-requests
      - "4"
      - --cuda-graph-max-bs-decode
      - "4"
      - --cuda-graph-max-bs-prefill
      - "3072"
      - --schedule-policy
      - hrrn
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --served-model-name
      - ${MODEL_NAME:-qwen3.8-27b}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --enable-metrics
      # Required for the gateway's cache-hit pricing tier.
      - --enable-cache-report
      - --enable-hierarchical-cache
      - --hicache-ratio
      - "2"
      - --hicache-io-backend
      - kernel
      - --hicache-mem-layout
      - page_first

volumes:
  sglang-cache:
