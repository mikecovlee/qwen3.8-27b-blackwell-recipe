# SGLang inference server — FP8 KV cache + vision. DEFAULT PROFILE.
#
# VALIDATED ON 32 GB (RTX PRO 4500; 2026-09-11, re-validated 09-15 & 09-19):
# fits the full 262144-token pool WITH the vision tower by rebalancing
# concurrency off the KV budget:
#   mrr 2 (not 4) + mamba pool at the upstream ratio (extra_buffer, pool 10 = 5 × mrr)
#   + prefill CUDA graph OFF (measured 0-1% prefill cost, frees 1.19 GB)
#   + mem-fraction 0.94.
# Boot accounting: KV 8.0 GB — capped by --max-total-tokens, NOT by memory (the
# static budget keeps ~0.7 GB unallocated) — mamba ~0.8 GB, ~1.78 GB runtime
# headroom; cold 166K prefill 87 s with zero retractions.  Full rationale and
# sizing history: README "Tuning".  On 48 GB+ raise mrr 4 / pool 20 / graph 4,
# re-enable the prefill graph (fraction 0.90-0.92) and re-run the soak.  Prefer
# this profile over NVFP4 KV unless you need 4 streams on 32 GB.
#
# IMAGE (mainline since 2026-09-19): llm-infer:hicache-06e4f2ed = v0.5.20 base
# (digest 06e4f2ed, tree 94602c9) with patches baked from inference/patches/:
#   sched_latch_fix  — false-latch double count (anchor scheduler.py:3887,
#                      self-verifying at startup; upstream still unfixed)
#   hicache P1/P3/C  — chunked-prefill write-through backup, mamba alloc degrade
#                      (skip + count instead of assert), host mamba pool knob
# Retired here: P2 honest host-hit (absorbed upstream in v0.5.20) and the LPM
# waitfix + its envs (replaced by --schedule-policy hrrn below).
# Rebuild (context = patches/):
#   docker build -f hicache-mamba-fix/img-06e4f2ed/Dockerfile \
#     -t llm-infer:hicache-06e4f2ed .
# Acceptance gates (tools/acceptance/): T1 latch, T3 mamba stash (--expect safe),
# T4 hicache thrash — all PASS on this build 2026-09-19 (../../evidence/).
# The image is hardcoded: a stale ${SGLANG_IMAGE} .env pin once silently broke
# reconciliation.  MAMBA_STRATEGY / MAMBA_POOL envs still drive the A/B arms of
# verify-mamba-stash.py.  History: git log of this file.
services:
  sglang:
    image: llm-infer:hicache-06e4f2ed
    container_name: llm-infer
    ports:
      - "${SGLANG_PORT:-8080}:8080"
    volumes:
      - ${MODELS_DIR:-$HOME/models}:/models:ro
      - sglang-cache:/root/.cache
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - MAX_JOBS=4
      - PYTHONUNBUFFERED=1
      # Reduce fragmentation pressure on the ~1.9 GB runtime headroom.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # Host mamba pool for HiCache load-back anchors: 7.0 GB = 88 slots.
      # Criterion (upstream #36935): kv_pool_tokens/cps <= device + host slots
      # => 262144/6144 ~ 43 <= 10 + 88.  Costs +3.7 GB host RAM vs the
      # ratio-derived pool; without it branch reuse never re-admits.
      - SGLANG_HICACHE_MAMBA_SIZE_GB=7.0
    shm_size: 8g
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - /models/${MODEL_DIR:-Qwen3.8-27B-NVFP4}
      - --kv-cache-dtype
      - fp8_e4m3
      - --attention-backend
      - flashinfer
      - --mem-fraction-static
      - "0.94"
      - --max-total-tokens
      - "262144"
      # Chunk size is load-bearing for host reuse: it sets the mamba-anchor
      # count (kv_pool/cps) checked against the mamba slot budget.  6144 keeps
      # 43 anchors <= 10 device + 88 host slots; 8192 OOMs this profile (32 GB).
      - --chunked-prefill-size
      - "6144"
      - --max-mamba-cache-size
      - "${MAMBA_POOL:-10}"
      - --mamba-radix-cache-strategy
      - ${MAMBA_STRATEGY:-extra_buffer}
      - --mamba-ssm-dtype
      - bfloat16
      # Zero-cost safety cap on cached mamba states per radix path.
      - --mamba-max-states-per-path
      - "2"
      - --max-running-requests
      - "2"
      - --cuda-graph-max-bs-decode
      - "2"
      # Prefill CUDA graph costs ~1.2 GB and measured 0-1% prefill impact on this
      # stack (chunked prefill of 6144 tokens is compute-bound, not launch-bound).
      # Disabling it is what makes FP8 KV + vision + full 262144 fit on 32 GB.
      - --disable-prefill-cuda-graph
      # HRRN admission ordering (upstream aging-based policy; mainline since
      # 2026-09-19, replacing lpm + the retired sched_lpm_waitfix).
      - --schedule-policy
      - hrrn
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --served-model-name
      - ${MODEL_NAME:-qwen3.8-27b}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --enable-metrics
      # Required for the gateway's cache-hit pricing tier.
      - --enable-cache-report
      - --enable-hierarchical-cache
      - --hicache-ratio
      - "2"
      - --hicache-io-backend
      - kernel
      - --hicache-mem-layout
      - page_first
      # Vision: cap images at 2 Mpx (area) and preprocess on CPU.  Count guard 128 sits
      # just past the natural ceiling: each 2 Mpx image is ~2050 tokens, so ~127 images
      # already exhaust the 262144 context (the server rejects with 400 long before any
      # VRAM issue — GPU peak is flat from 4 to 96 images).  The guard exists ONLY
      # because it fires before preprocessing; the context check fires after.
      - --mm-process-config
      - '{"image": {"size": {"longest_edge": 2097152, "shortest_edge": 65536}}}'
      - --image-processor-backend
      - pil
      - --limit-mm-data-per-request
      - '{"image": 128, "video": 0}'

volumes:
  sglang-cache:
