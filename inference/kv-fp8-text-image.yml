# SGLang inference server — FP8 KV cache + vision. DEFAULT PROFILE.
#
# VALIDATED ON 32 GB (RTX PRO 4500; 2026-09-11, re-validated 09-15, 09-19 & on the
# v0.5.21 line): fits the full 262144-token pool WITH the vision tower by
# rebalancing concurrency off the KV budget:
#   mrr 2 (not 4) + mamba pool at the upstream ratio (extra_buffer, pool 10 = 5 × mrr)
#   + prefill CUDA graph OFF (~1.8 GB runtime headroom)
#   + mem-fraction 0.94
#   + mixed chunk ON (decode rides the prefill batch; worst decode gap 9.5 s -> 2.3 s).
# The prefill graph cannot be afforded here: it costs ~1.1-1.6 GB, and with it on
# the headroom drops to ~0.78 GB — too little for the HiCache host<->device thrash
# (verify-hicache-thrash OOMs).  The measured prefill-latency cost of disabling it
# is ~0-1%.  Boot accounting: KV pool 262144 tokens (capped by --max-total-tokens,
# not by memory).  Full rationale and sizing history: README "Tuning".  On 48 GB+
# raise mrr 4 / pool 20 / graph 4 and re-enable the prefill graph.
# Prefer this profile over NVFP4 KV unless you need 4 streams on 32 GB.
#
# IMAGE (mainline since v0.5.21): llm-infer:hicache-b1259f3e = v0.5.21 base
# (digest b1259f3e, tree e00930c) with patches baked from inference/patches/:
#   sched_latch_fix  — false-latch double count (anchor scheduler.py:3976,
#                      self-verifying at startup; upstream still unfixed)
#   hicache P3       — mamba alloc degrade (skip + count instead of assert)
# Retired here: P1 chunked write-through (absorbed upstream: chunked-prefill
# stash + flush_pending_backups), P2 honest host-hit (absorbed in v0.5.20), the
# C host-mamba-pool knob (obsolete: v0.5.21 sizes the mamba host pool from the
# HiCache ratio — the patched code stays baked but dormant when the env is
# unset), and the LPM waitfix + its envs (replaced by --schedule-policy hrrn
# below).  v0.5.21 runs the unified radix tree on the Rust core by default.
# Rebuild (context = patches/):
#   docker build -f hicache-mamba-fix/img-b1259f3e/Dockerfile \
#     -t llm-infer:hicache-b1259f3e .
# Acceptance gates (tools/acceptance/): T1 latch, T3 mamba stash (--expect safe),
# T4 hicache thrash — all PASS on this build (../../evidence/).
# The image is hardcoded: a stale ${SGLANG_IMAGE} .env pin once silently broke
# reconciliation.  MAMBA_STRATEGY / MAMBA_POOL envs still drive the A/B arms of
# verify-mamba-stash.py.  History: git log of this file.
services:
  sglang:
    image: llm-infer:hicache-b1259f3e
    container_name: llm-infer
    ports:
      - "${SGLANG_PORT:-8080}:8080"
    volumes:
      - ${MODELS_DIR:-$HOME/models}:/models:ro
      - sglang-cache:/root/.cache
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - MAX_JOBS=4
      - PYTHONUNBUFFERED=1
      # Reduce fragmentation pressure under the tight runtime headroom.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    shm_size: 8g
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - /models/${MODEL_DIR:-Qwen3.8-27B-NVFP4}
      - --kv-cache-dtype
      - fp8_e4m3
      - --attention-backend
      - flashinfer
      - --mem-fraction-static
      - "0.94"
      - --max-total-tokens
      - "262144"
      # Chunk size is load-bearing for host reuse: it sets the mamba-anchor
      # count (kv_pool/cps).  v0.5.21's reworked mamba accounting keeps 6144
      # safe (T3/T4 validated on v0.5.21); 8192 OOMs this profile (32 GB).
      - --chunked-prefill-size
      - "6144"
      # Mixed chunk: let running decode requests ride inside a chunked prefill
      # batch.  Without it one long prefill freezes every concurrent decode for
      # its whole duration (measured: a single 9.5 s inter-token gap on a
      # 512-token stream during a 40K-token prefill; wall 12.1 s -> 22.0 s).
      # It only trims the prefill token budget by the mixed decode tokens; row
      # and quota accounting are unchanged, so the sched-latch anchor is
      # unaffected (T1 re-verified with this flag on).
      - --enable-mixed-chunk
      - --max-mamba-cache-size
      - "${MAMBA_POOL:-10}"
      - --mamba-radix-cache-strategy
      - ${MAMBA_STRATEGY:-extra_buffer}
      - --mamba-ssm-dtype
      - bfloat16
      # Zero-cost safety cap on cached mamba states per radix path.
      - --mamba-max-states-per-path
      - "2"
      - --max-running-requests
      - "2"
      - --cuda-graph-max-bs-decode
      - "2"
      # Prefill CUDA graph OFF: the captured shapes cost ~1.1-1.6 GB, which does
      # not fit FP8 KV + vision + full 262144 on 32 GB once the HiCache
      # host<->device thrash needs its headroom — with the graph on, T4
      # hicache-thrash OOMs (measured on v0.5.21: only ~0.78 GB left -> CUDA OOM).
      # Prefill-latency cost of disabling it is ~0-1% (README "Tuning").
      - --disable-prefill-cuda-graph
      # HRRN admission ordering (upstream aging-based policy; mainline since
      # 2026-09-19, replacing lpm + the retired sched_lpm_waitfix).
      - --schedule-policy
      - hrrn
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --served-model-name
      - ${MODEL_NAME:-qwen3.8-27b}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --enable-metrics
      # Required for the gateway's cache-hit pricing tier.
      - --enable-cache-report
      - --enable-hierarchical-cache
      - --hicache-ratio
      - "2"
      - --hicache-io-backend
      - kernel
      - --hicache-mem-layout
      - page_first
      # Vision: cap images at 2 Mpx (area) and preprocess on CPU.  Count guard 128 sits
      # just past the natural ceiling: each 2 Mpx image is ~2050 tokens, so ~127 images
      # already exhaust the 262144 context (the server rejects with 400 long before any
      # VRAM issue — GPU peak is flat from 4 to 96 images).  The guard exists ONLY
      # because it fires before preprocessing; the context check fires after.
      - --mm-process-config
      - '{"image": {"size": {"longest_edge": 2097152, "shortest_edge": 65536}}}'
      - --image-processor-backend
      - pil
      - --limit-mm-data-per-request
      - '{"image": 128, "video": 0}'

volumes:
  sglang-cache:
