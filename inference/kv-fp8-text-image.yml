# SGLang inference server — FP8 KV cache + vision. DEFAULT PROFILE.
#
# VALIDATED ON 32 GB (RTX PRO 4500, 2026-09-11): fits the full 262144-token pool
# WITH the vision tower by rebalancing concurrency off the KV budget:
#   mrr 2 (not 4) + mamba pool sized by the upstream ratio (see 09-15 note)
#   + prefill CUDA graph OFF (measured 0-1% prefill cost, frees 1.19 GB)
#   + mem-fraction 0.94.
# Boot accounting: KV 8.0 GB — capped by --max-total-tokens, NOT by memory (the
# static budget keeps ~0.7 GB unallocated) — mamba ~0.8 GB, ~1.9 GB runtime
# headroom; cold 166K prefill 87 s with zero retractions.  See README "Tuning".
# On 48 GB+ you may raise mrr to 4 with `--max-mamba-cache-size 20 /
# --cuda-graph-max-bs-decode 4` and drop back to fraction 0.90-0.92 (re-run the
# soak).  Prefer this profile over NVFP4 KV unless you need 4 streams on 32 GB.
#
# [2026-09-15] MAMBA POOL EXHAUSTION FIX — strategy extra_buffer_lazy → extra_buffer,
# pool 8 → 10 (= upstream auto-sizing for this deployment shape):
#   Production (v0.5.19, this profile at lazy/8/mrr2) crashed once after 13 h:
#   2 running streams held 6/8 slots; a medium request finished freeing ~2; a
#   queued 150K-token request was admitted (lazy admission costs 2 slots —
#   exactly the 2 free) and its first chunked-prefill stash (scheduler
#   stash_chunked_request → cache_unfinished_req → donate track state to the
#   radix tree) needed one MORE slot → pool empty, every remaining slot locked
#   by in-flight requests/tree → evict_for_alloc failed → `assert slot is not
#   None` in _alloc_mamba_slot (unified_cache/components/mamba_component.py) →
#   scheduler SIGQUIT → container restart (one in-flight gateway request lost).
#   Root cause is upstream budget undercount, acknowledged in-tree:
#     - schedule_policy.py _mamba_gap_budget_for_req: "FIXME: if over-admission
#       crashes under pressure, make this more conservative";
#     - unit test test_mamba_donated_alloc_ratio.py pins pool exhaustion →
#       AssertionError as EXPECTED fail-loud behavior and gives the sizing rule:
#       first cache_unfinished_req peak = N own + N locked + 1 donated; ratio 2
#       (pool = 2×mrr) asserts with no evictable victim, ratio ≥3 has slack.
#   Fix: strategy=extra_buffer is upstream's own `auto` choice when overlap
#   scheduling is on (arg_groups/overrides.py): admission coefficient rises
#   2 → 3 slots/req, so the crash scenario is rejected to the queue instead of
#   admitted into exhaustion; pool 10 = ratio 5 × mrr 2, matching upstream
#   auto-sizing (kv_cache_configurator _calculate_mamba_ratio: base 3 + overlap
#   2).  Memory cost +0.16 GB (10 slots ≈ 0.81 GB, ~81 MB/slot) is absorbed by
#   the unallocated static budget — KV still allocates the full 262144 tokens,
#   context is NOT reduced.  Cost of dropping _lazy: slightly more conservative
#   admission (3 free slots required instead of 2).  The assert-on-exhaustion
#   class remains upstream design; other extreme exhaustion paths are still
#   theoretically fatal (a graceful-degradation patch was evaluated, not shipped).
#   MAMBA_STRATEGY / MAMBA_POOL envs exist for A/B testing — the crash
#   reproduction arm uses MAMBA_STRATEGY=extra_buffer_lazy MAMBA_POOL=8 with
#   tools/acceptance/verify-mamba-stash.py; defaults = production values.
#
# [2026-09-14] v0.5.19 line (base digest d6e72886): scheduler patches are BAKED
# into the derived image via 99-sched-latch-fix.pth (the PYTHONPATH=/patches
# mount is silently shadowed by the Ubuntu system sitecustomize on this base —
# do NOT reintroduce it):
#   sched_latch_fix   — false-latch fix (upstream v0.5.19 still unfixed; without
#                       it a request arriving during a long chunked prefill waits
#                       out that whole prefill — a transient mrr-1);
#   sched_lpm_waitfix — LPM starvation guard (T=20s N=1; queue reordering only,
#                       adds no capacity; SGLANG_LPM_WAIT_BOOST_SECONDS=0
#                       disables it and leaves pure LPM ordering).
# Rebuild: cd patches/sched-latch-fix && \
#   docker build -f img-d6e72886/Dockerfile -t llm-infer:latchfix-d6e72886 .
services:
  sglang:
    image: ${SGLANG_IMAGE:-llm-infer:latchfix-d6e72886}
    container_name: llm-infer
    ports:
      - "${SGLANG_PORT:-8080}:8080"
    volumes:
      - ${MODELS_DIR:-$HOME/models}:/models:ro
      - sglang-cache:/root/.cache
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - MAX_JOBS=4
      - PYTHONUNBUFFERED=1
      # Reduce fragmentation pressure on the ~1.9 GB runtime headroom.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # LPM wait-boost (baked sched_lpm_waitfix): pin the longest waiter.
      - SGLANG_LPM_WAIT_BOOST_SECONDS=20
      - SGLANG_LPM_WAIT_BOOST_MAX=1
    shm_size: 8g
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path
      - /models/${MODEL_DIR:-Qwen3.8-27B-NVFP4}
      - --kv-cache-dtype
      - fp8_e4m3
      - --attention-backend
      - flashinfer
      - --mem-fraction-static
      - "0.94"
      - --max-total-tokens
      - "262144"
      - --max-mamba-cache-size
      - "${MAMBA_POOL:-10}"
      - --mamba-radix-cache-strategy
      - ${MAMBA_STRATEGY:-extra_buffer}
      - --mamba-ssm-dtype
      - bfloat16
      # Zero-cost safety cap on cached mamba states per radix path.
      - --mamba-max-states-per-path
      - "2"
      - --max-running-requests
      - "2"
      - --cuda-graph-max-bs-decode
      - "2"
      # Prefill CUDA graph costs ~1.2 GB and measured 0-1% prefill impact on this
      # stack (chunked prefill of 2048 tokens is compute-bound, not launch-bound).
      # Disabling it is what makes FP8 KV + vision + full 262144 fit on 32 GB.
      - --disable-prefill-cuda-graph
      # LPM admission ordering (input-side SJF proxy: longer prefix hit first;
      # hot continuations fast-path).  Pairs with sched_lpm_waitfix above.
      - --schedule-policy
      - lpm
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --served-model-name
      - ${MODEL_NAME:-qwen3.8-27b}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --enable-metrics
      # Required for the gateway's cache-hit pricing tier.
      - --enable-cache-report
      - --enable-hierarchical-cache
      - --hicache-ratio
      - "2"
      - --hicache-io-backend
      - kernel
      - --hicache-mem-layout
      - page_first
      # Vision: cap images at 2 Mpx (area) and preprocess on CPU.  Count guard 128 sits
      # just past the natural ceiling: each 2 Mpx image is ~2050 tokens, so ~127 images
      # already exhaust the 262144 context (the server rejects with 400 long before any
      # VRAM issue — GPU peak is flat from 4 to 96 images).  The guard exists ONLY
      # because it fires before preprocessing; the context check fires after.
      - --mm-process-config
      - '{"image": {"size": {"longest_edge": 2097152, "shortest_edge": 65536}}}'
      - --image-processor-backend
      - pil
      - --limit-mm-data-per-request
      - '{"image": 128, "video": 0}'

volumes:
  sglang-cache:
